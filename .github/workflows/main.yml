name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: mkdir -p www && cp index.html www/
      - run: npx cap add android
      - run: |
          set -e
          convert icon.png -crop 640x640+175+148 +repage crop.png
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            r=android/app/src/main/res/mipmap-$1
            convert crop.png -resize $2x$2 $r/ic_launcher.png
            convert crop.png -resize $2x$2 $r/ic_launcher_round.png
            s=$(($3*60/100))
            convert crop.png -resize ${s}x${s} -background '#0b0d12' -gravity center -extent $3x$3 $r/ic_launcher_foreground.png
          done
          sed -i 's/#[0-9A-Fa-f]\{6\}/#0B0D12/' android/app/src/main/res/values/ic_launcher_background.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: elektro-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
